<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أُجْرَه — صندوق الأمانات المفقودة</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/icon-180.png">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Cairo',Tahoma,sans-serif;background:#000;color:#E8C45A;min-height:100vh}
  header{text-align:center;padding:3vh 3vw}
  header .logo{width:80px;height:80px;object-fit:contain}
  .container{max-width:820px;margin:0 auto;padding:0 4vw}
  .card{background:rgba(255,255,255,0.06);border:1px solid rgba(212,175,90,0.4);border-radius:18px;padding:3vh 5vw;margin-bottom:3vh}
  .card h3{margin-bottom:10px}
  .field{margin-bottom:1.6vh}
  .field label{display:block;font-size:14px;color:#c9d8cf;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.25);color:#fff;font-family:inherit;font-size:14px}
  .field textarea{min-height:80px;resize:vertical}
  .field select option{color:#000}
  .grid{display:flex;gap:2vw;flex-wrap:wrap}
  .grid .field{flex:1;min-width:200px}
  .btn{padding:12px 18px;border:none;border-radius:12px;background:linear-gradient(135deg,#E8C45A 0%,#c79a2e 100%);color:#000;font-weight:800;cursor:pointer;font-family:inherit}
  .btn-sec{background:#222;color:#E8C45A;border:1px solid rgba(212,175,90,0.4)}
  .item{background:rgba(0,0,0,0.3);border:1px solid rgba(212,175,90,0.25);border-radius:14px;padding:12px;margin:10px 0;line-height:1.7}
  .muted{color:#c9d8cf;font-size:13px}
  .badge{display:inline-block;background:rgba(212,175,90,0.15);border:1px solid rgba(212,175,90,0.35);padding:3px 10px;border-radius:20px;font-size:12px;margin:2px}
  a{color:#7ec8ff}
</style>
</head>
<body>
<header>
  <img src="images/logo.png" class="logo" alt="شعار أُجْرَه">
  <h2>صندوق الأمانات المفقودة</h2>
  <div style="margin-top:6px"><a href="index.html">→ العودة للرئيسية</a></div>
</header>
<div class="container">
  <div class="card">
    <h3>الإبلاغ عن غرض موجود</h3>
    <p class="muted" style="margin-bottom:10px">إذا وجدت غرضاً لا يخصك في السيارة (راكباً كنت أو سائقاً)، سجّله هنا مع بيانات السيارة من لقطة الشاشة. الطرف الآخر يستطيع التواصل عبر رقم هاتفك.</p>
    <form onsubmit="return submitFound(event)">
      <div class="grid">
        <div class="field">
          <label>أنت</label>
          <select id="f_role" onchange="toggleLastCustomer()">
            <option value="passenger">راكب وجد غرضاً</option>
            <option value="driver">سائق وجد غرضاً</option>
          </select>
        </div>
        <div class="field">
          <label>اسمك</label>
          <input id="f_name" placeholder="اسمك الكامل">
        </div>
      </div>
      <div class="grid">
        <div class="field">
          <label>رقم هاتفك للتواصل</label>
          <input id="f_phone" placeholder="أي رقم هاتف">
        </div>
        <div class="field" id="lastCustomerField" style="display:none">
          <label>رقم هاتف آخر عميل ركب قبل العثور (للسائق)</label>
          <input id="f_lastCustomer" placeholder="09xxxxxxxx">
        </div>
      </div>
      <div class="field">
        <label>وصف الغرض الموجود</label>
        <textarea id="f_desc" placeholder="مثال: حقيبة سوداء، هاتف آيفون، محفظة بنية..."></textarea>
      </div>
      <div class="grid">
        <div class="field">
          <label>بيانات السيارة — رقم اللوحة (من لقطة الشاشة)</label>
          <input id="f_plate" placeholder="123456/دمشق">
        </div>
        <div class="field">
          <label>نوع/موديل السيارة</label>
          <input id="f_model" placeholder="كيا ريو 2021">
        </div>
      </div>
      <div class="grid">
        <div class="field">
          <label>اسم السائق (من لقطة الشاشة)</label>
          <input id="f_driver" placeholder="عمر حسن">
        </div>
        <div class="field">
          <label>رقم هوية السائق (إن وجد)</label>
          <input id="f_driverId" placeholder="0101...">
        </div>
      </div>
      <button class="btn" type="submit">نشر البلاغ</button>
    </form>
  </div>

  <div class="card">
    <h3>البلاغات المنشورة</h3>
    <div id="list" class="muted">جاري التحميل...</div>
  </div>
</div>
<script>
  function toggleLastCustomer(){
    var r=document.getElementById('f_role').value;
    document.getElementById('lastCustomerField').style.display = r==='driver' ? 'block' : 'none';
  }
  function getList(){ try{return JSON.parse(localStorage.getItem('ajrah_lost')||'[]')}catch(e){return []} }
  function saveList(a){ localStorage.setItem('ajrah_lost', JSON.stringify(a)); }
  function submitFound(e){
    e.preventDefault();
    var role=document.getElementById('f_role').value;
    var name=document.getElementById('f_name').value.trim();
    var phone=document.getElementById('f_phone').value.trim();
    var desc=document.getElementById('f_desc').value.trim();
    var plate=document.getElementById('f_plate').value.trim();
    var model=document.getElementById('f_model').value.trim();
    var driver=document.getElementById('f_driver').value.trim();
    var driverId=document.getElementById('f_driverId').value.trim();
    var lastCust=document.getElementById('f_lastCustomer').value.trim();
    if (!name || !phone || !desc){ alert('أدخل اسمك ورقم هاتفك ووصف الغرض'); return false; }
    if (phone.replace(/\D/g,'').length<7){ alert('رقم هاتف غير صالح'); return false; }
    var item={id:Date.now(), at:new Date().toISOString(), role:role, name:name, phone:phone, desc:desc, plate:plate, model:model, driver:driver, driverId:driverId, lastCustomer:lastCust, status:'open'};
    var list=getList(); list.push(item); saveList(list);
    alert('تم نشر البلاغ — سيظهر للطرف الآخر مع رقم تواصلك.');
    e.target.reset(); toggleLastCustomer(); render();
    return false;
  }
  function render(){
    var list=getList();
    var el=document.getElementById('list');
    if (!list.length){ el.innerHTML='<div class="muted">لا توجد بلاغات بعد.</div>'; return; }
    var html='';
    for (var i=list.length-1;i>=0;i--){
      var it=list[i];
      var who = it.role==='driver' ? 'سائق وجد غرضاً' : 'راكب وجد غرضاً';
      html+='<div class="item">'
        +'<div><span class="badge">'+who+'</span> <span class="badge">'+new Date(it.at).toLocaleString('ar-SY')+'</span> '+(it.status==='claimed' ? '<span class="badge" style="background:#2a5">تم التسليم</span>' : '')+'</div>'
        +'<div style="margin:6px 0"><b>'+it.desc+'</b></div>'
        +'<div style="font-size:13px">المُبلغ: '+it.name+' — <a href="tel:'+it.phone+'">'+it.phone+'</a></div>'
        +'<div style="font-size:13px">السيارة: '+(it.model||'—')+' — لوحة: '+(it.plate||'—')+' — السائق: '+(it.driver||'—')+(it.driverId?' — هوية:'+it.driverId:'')+'</div>'
        +(it.lastCustomer ? '<div style="font-size:13px">آخر عميل قبل العثور: <a href="tel:'+it.lastCustomer+'">'+it.lastCustomer+'</a></div>' : '')
        +'<div style="margin-top:8px"><button class="btn btn-sec" onclick="claim('+it.id+')">تم التسليم / إغلاق البلاغ</button> <button class="btn btn-sec" onclick="removeItem('+it.id+')">حذف</button></div>'
        +'</div>';
    }
    el.innerHTML=html;
  }
  function claim(id){
    var list=getList();
    for (var i=0;i<list.length;i++) if (list[i].id===id) list[i].status='claimed';
    saveList(list); render();
  }
  function removeItem(id){
    if (!confirm('حذف البلاغ؟')) return;
    var list=getList().filter(function(x){return x.id!==id});
    saveList(list); render();
  }
  toggleLastCustomer(); render();
</script>
</body>
</html>
