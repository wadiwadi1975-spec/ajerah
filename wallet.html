<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أُجْرَه — المحفظة</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/icon-180.png">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Cairo',Tahoma,sans-serif;background:#000;color:#E8C45A;min-height:100vh}
  header{text-align:center;padding:3vh 3vw}
  header .logo{width:80px;height:80px;object-fit:contain}
  .container{max-width:720px;margin:0 auto;padding:0 4vw}
  .card{background:rgba(255,255,255,0.06);border:1px solid rgba(212,175,90,0.4);border-radius:18px;padding:3vh 5vw;margin-bottom:2vh}
  .btn{padding:12px 16px;border:none;border-radius:12px;background:linear-gradient(135deg,#E8C45A 0%,#c79a2e 100%);color:#000;font-weight:800;cursor:pointer;font-family:inherit}
  .danger{color:#ff8a8a}
  .muted{color:#c9d8cf;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.1);text-align:right}
  th{color:#E8C45A}
  a{color:#7ec8ff}
</style>
</head>
<body>
<header>
  <img src="images/logo.png" class="logo" alt="شعار أُجْرَه">
  <h2>محفظة السائق</h2>
  <div style="margin-top:6px"><a href="index.html">→ العودة للرئيسية</a></div>
</header>
<div class="container">
  <div class="card" id="walletCard">جاري التحميل...</div>
  <div class="card">
    <h3 style="margin-bottom:8px">سجل الرحلات</h3>
    <div id="history"></div>
  </div>
  <div class="card muted">
    الآلية: الدفع الإلكتروني يخصم العمولة (15%) تلقائياً. الدفع النقدي يتراكم في الرصيد المستحق. عند وصوله لحد <b>200,000 ل.س</b> يُطلب التسديد وإلا يُعلّق الظهور ضمن 1 كم. الاشتراك الاختياري للمحترفين يخفض العمولة إلى 10% (قريباً).
  </div>
</div>
<script>
  function fmtSYP(n){ return Math.round(n).toLocaleString('ar-SY')+' ل.س'; }
  function payLabel(p){ var m={cash:'نقدي', shamcash:'شام كاش', syriatel:'سيريتل كاش', mtn:'MTN كاش', bank:'تحويل بنكي', electronic:'إلكتروني'}; return m[p]||p; }
  var THRESH=200000;
  function walletKey(phone){ return 'ajrah_wallet_'+phone; }
  function getDue(phone){ return parseInt(localStorage.getItem(walletKey(phone))||'0',10); }
  function load(){
    var cur=null; try{cur=JSON.parse(localStorage.getItem('ajrah_current')||'null')}catch(e){}
    if (!cur) { document.getElementById('walletCard').innerHTML='يجب تسجيل دخول كـ سائق أولاً. <a href="auth.html">تسجيل</a>'; return; }
    if (cur.role!=='driver'){ 
      // للراكب: اعرض رحلاته فقط دون محفظة
      var ridesAll=JSON.parse(localStorage.getItem('ajrah_rides')||'[]');
      var mine=ridesAll.filter(function(r){ return r.passenger && r.passenger.phone===cur.phone; });
      document.getElementById('walletCard').innerHTML='<div>حساب راكب: <b>'+cur.name+'</b> — '+cur.phone+'</div><div class="muted">المحفظة خاصة بالسائقين.</div>';
      renderHistory(mine, false);
      return;
    }
    var due=getDue(cur.phone);
    var card=document.getElementById('walletCard');
    var warn = due>=THRESH ? '<div class="danger">وصلت الحد — يجب تسديد المستحقات ليبقى حسابك نشطاً ضمن 1 كم.</div>' : '<div class="muted">الحساب نشط — يظهر ضمن 1 كم حول طالبي الأجرة.</div>';
    var veh = cur.vehicle ? (cur.vehicle.type+' — '+cur.vehicle.model) : '';
    card.innerHTML = '<div>مرحباً <b>'+cur.name+'</b> — '+cur.phone+' ('+veh+')</div>' +
      '<div style="margin:10px 0;font-size:22px">الرصيد المستحق (محفظتك الخاصة): <b>'+fmtSYP(due)+'</b></div>' +
      warn +
      '<div style="margin-top:12px"><button class="btn" onclick="payNow()">تسديد المستحقات (محاكاة)</button> <button class="btn" style="background:#333;color:#fff;margin-right:8px" onclick="clearWallet()">تصفير (للتجربة)</button></div>' +
      '<div class="muted" style="margin-top:8px">لا تُعرض بياناتك الخاصة للزبون إلا بعد قبولك الطلب. كل رحلة تظهر هنا مع أجرتها وعمولتها.</div>';
    var rides=JSON.parse(localStorage.getItem('ajrah_rides')||'[]');
    var mine=rides.filter(function(r){
      var dPhone = r.driver && r.driver.phone ? r.driver.phone : r.driver;
      return dPhone===cur.phone || r.driver===cur.name;
    });
    renderHistory(mine, true);
  }
  function renderHistory(list, isDriver){
    var h=document.getElementById('history');
    if (!list.length){ h.innerHTML='<div class="muted">لا توجد رحلات مسجلة لهذا الحساب بعد.</div>'; return; }
    var html='<table><tr><th>التاريخ</th><th>المسار</th><th>الراكب</th><th>الدفع</th><th>الأجر</th><th>العمولة</th><th>الصافي</th><th>الحالة</th><th>إجراء</th></tr>';
    for (var i=list.length-1;i>=0;i--){
      var r=list[i];
      var idx=(JSON.parse(localStorage.getItem('ajrah_rides')||'[]')).indexOf(r);
      // للعثور على الفهرس الحقيقي
      var all=JSON.parse(localStorage.getItem('ajrah_rides')||'[]');
      var realIdx=-1;
      for (var k=0;k<all.length;k++) if (all[k].id===r.id) { realIdx=k; break; }
      var statusMap={pending:'بانتظار قبولك', accepted:'مقبول — بانتظار الإتمام', cash_confirmed:'مكتمل نقداً', completed:'مكتمل إلكتروني'};
      var status=statusMap[r.status]||r.status||'—';
      var passenger = r.passenger ? (r.passenger.name+'<br><span style="font-size:12px">'+r.passenger.phone+'</span>') : '—';
      var route = (r.from||'—')+' → '+(r.to||'—');
      var net = r.net!=null ? r.net : (r.fare - r.fee);
      var action='';
      if (isDriver){
        if (r.status==='pending') action='<button class="btn" style="padding:6px 10px;font-size:13px" onclick="acceptRide('+realIdx+')">قبول الطلب</button>';
        else if (r.status==='accepted' && r.pay==='cash') action='<button class="btn" style="padding:6px 10px;font-size:13px" onclick="confirmCash('+realIdx+')">استلمت نقداً</button>';
        else if (r.status==='accepted' && r.pay==='electronic') action='<button class="btn" style="padding:6px 10px;font-size:13px" onclick="completeElectronic('+realIdx+')">إتمام (إلكتروني)</button>';
        else action='<span class="muted">—</span>';
      }
      html+='<tr><td>'+new Date(r.at).toLocaleString('ar-SY')+'</td><td>'+route+'</td><td>'+passenger+'</td><td>'+payLabel(r.pay)+'</td><td>'+fmtSYP(r.fare)+'</td><td>'+fmtSYP(r.fee)+'</td><td>'+fmtSYP(net)+'</td><td>'+status+'</td><td>'+action+'</td></tr>';
    }
    html+='</table>';
    h.innerHTML=html;
  }
  function acceptRide(idx){
    var rides=JSON.parse(localStorage.getItem('ajrah_rides')||'[]');
    var r=rides[idx];
    if (!r || r.status!=='pending') return;
    if (!confirm('قبول طلب الرحلة من '+r.passenger.name+'؟ سيظهر رقمك للراكب.')) return;
    r.status='accepted';
    localStorage.setItem('ajrah_rides', JSON.stringify(rides));
    alert('تم القبول — تواصل مع الراكب على '+r.passenger.phone);
    load();
  }
  function confirmCash(idx){
    var rides=JSON.parse(localStorage.getItem('ajrah_rides')||'[]');
    var r=rides[idx];
    if (!r || r.status!=='accepted' || r.pay!=='cash') return;
    if (!confirm('تأكيد استلام '+fmtSYP(r.fare)+' نقداً من الراكب؟ سيُضاف '+fmtSYP(r.fee)+' لعمولة محفظتك.')) return;
    var cur=null; try{cur=JSON.parse(localStorage.getItem('ajrah_current')||'null')}catch(e){}
    var key=walletKey(cur.phone);
    var due=parseInt(localStorage.getItem(key)||'0',10);
    due+=r.fee;
    localStorage.setItem(key, due);
    r.status='cash_confirmed';
    localStorage.setItem('ajrah_rides', JSON.stringify(rides));
    alert('تم التأكيد — تراكمت العمولة. رصيدك الآن: '+fmtSYP(due));
    load();
  }
  function completeElectronic(idx){
    var rides=JSON.parse(localStorage.getItem('ajrah_rides')||'[]');
    var r=rides[idx];
    if (!r || r.status!=='accepted') return;
    r.status='completed';
    localStorage.setItem('ajrah_rides', JSON.stringify(rides));
    alert('تم إتمام الرحلة إلكترونياً — خصمت العمولة تلقائياً.');
    load();
  }
  function payNow(){
    var cur=null; try{cur=JSON.parse(localStorage.getItem('ajrah_current')||'null')}catch(e){}
    if (!cur) return;
    var key=walletKey(cur.phone);
    var due=parseInt(localStorage.getItem(key)||'0',10);
    if (!due) { alert('لا يوجد مستحقات'); return; }
    if (confirm('تأكيد تسديد '+fmtSYP(due)+' إلكترونياً؟ (محاكاة)')) {
      localStorage.setItem(key,'0');
      alert('تم التسديد — شكراً. حسابك نشط.');
      load();
    }
  }
  function clearWallet(){
    var cur=null; try{cur=JSON.parse(localStorage.getItem('ajrah_current')||'null')}catch(e){}
    if (!cur) return;
    localStorage.setItem(walletKey(cur.phone),'0');
    load();
  }
  load();
</script>
</body>
</html>
