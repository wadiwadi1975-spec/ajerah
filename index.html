<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أُجْرَه — تطبيق التوصيل داخل سوريا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cairo', Tahoma, sans-serif;
    background: linear-gradient(135deg, #021430 0%, #0B3A7A 50%, #374454 100%);
    color: #E8C45A;
    min-height: 100vh;
  }
  header { text-align: center; padding: 4vh 3vw 2vh; }
  header .logo {
    width: 120px; height: 120px; object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.45)); margin-bottom: 8px;
  }
  header h1 { font-size: clamp(28px, 5vw, 56px); font-weight: 800; letter-spacing: 1px; }
  header p { color: #c9d8cf; margin-top: 6px; font-size: clamp(13px, 2vw, 20px); }

  .container { max-width: 920px; margin: 2vh auto; padding: 0 4vw; }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(212,175,90,0.4);
    border-radius: 18px;
    padding: 3vh 5vw;
    margin-bottom: 3vh;
  }
  .row { display: flex; gap: 2vw; flex-wrap: wrap; }
  .field { flex: 1; min-width: 200px; margin-bottom: 2vh; }
  .field label { display: block; font-size: 14px; color: #c9d8cf; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.25); color: #fff;
    font-family: inherit; font-size: 16px;
  }
  .field input::placeholder { color: #9fb3a8; }
  .field select {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.25); color: #fff;
    font-family: inherit; font-size: 16px;
  }
  .field select option { color: #000; }
  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #E8C45A 0%, #c79a2e 100%);
    color: #06231b; font-weight: 800; font-size: 18px;
    font-family: inherit; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.05); }

  .map-box {
    height: 42vh; border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(212,175,90,0.4); background: rgba(0,0,0,0.2);
  }
  .info {
    margin-top: 1.5vh; text-align: center; font-size: clamp(14px, 2vw, 20px);
    color: #fff; line-height: 1.8;
  }
  .info b { color: #E8C45A; }
  .driver-card { display: none; text-align: center; line-height: 1.9; }
  .driver-card.active { display: block; }
  .driver-card h3 { font-size: 20px; margin-bottom: 10px; }
  .driver-card .phone { direction: ltr; font-weight: 800; color: #E8C45A; font-size: 18px; }
  .driver-card .badge { display: inline-block; background: rgba(212,175,90,0.18); border: 1px solid rgba(212,175,90,0.4); padding: 4px 10px; border-radius: 20px; font-size: 14px; margin: 2px; }
  .driver-opt { background: rgba(0,0,0,0.22); border: 1px solid rgba(212,175,90,0.28); border-radius: 14px; padding: 12px; margin: 10px 0; text-align: right; }
  .driver-opt .opt-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }

  .cities { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 1vh; }
  .city {
    background: rgba(212,175,90,0.12); border: 1px solid rgba(212,175,90,0.35);
    color: #E8C45A; padding: 6px 12px; border-radius: 20px; font-size: 14px;
  }
  footer { text-align: center; color: #9fb3a8; padding: 3vh 3vw; font-size: 13px; opacity: 0.8; }
</style>
</head>
<body>
  <header>
    <img src="images/logo.png" alt="شعار أُجْرَه" class="logo">
    <h1>أُجْرَه</h1>
    <p>تطبيق التوصيل داخل سوريا — من الانطلاق إلى الوجهة بأُجْرَه</p>
  </header>

  <div class="container">
    <div class="card">
      <div class="row">
        <div class="field">
          <label>نقطة الانطلاق (مكانك الحالي)</label>
          <input id="from" placeholder="مثال: درعا" value="درعا">
        </div>
        <div class="field">
          <label>الوجهة</label>
          <input id="to" placeholder="مثال: مطار دمشق الدولي" value="مطار دمشق الدولي">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>نوع السيارة المطلوبة</label>
          <select id="vehicle">
            <option value="private">سيارة خاصة</option>
            <option value="taxi" selected>تاكسي</option>
            <option value="bus">حافلة (نقل عام)</option>
            <option value="van">فان</option>
          </select>
        </div>
        <div class="field">
          <label>العملة</label>
          <select id="currency">
            <option value="syp" selected>ل.س — الليرة السورية</option>
            <option value="usd">$ — دولار أمريكي</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>رقم هاتفك (ليتواصل السائق معك)</label>
        <input id="p_phone" placeholder="09xxxxxxxx">
      </div>
      <button class="btn" onclick="requestRide()">ابحث عن أقرب سيارة</button>
    </div>

    <div class="card">
      <div id="map" class="map-box"></div>
      <div id="info" class="info">الخريطة تُحمّل…</div>
    </div>

    <div class="card driver-card" id="driverCard">
      <h3>أقرب سيارة إليك</h3>
      <div id="driverInfo"></div>
    </div>

    <div class="card">
      <div class="cities">
        <span class="city">دمشق</span><span class="city">درعا</span>
        <span class="city">حلب</span><span class="city">حمص</span>
        <span class="city">حماه</span><span class="city">اللاذقية</span>
        <span class="city">إدلب</span><span class="city">دير الزور</span>
        <span class="city">الرقة</span><span class="city">الحسكة</span>
        <span class="city">القامشلي</span><span class="city">طرطوس</span>
        <span class="city">السويداء</span><span class="city">القنيطرة</span>
      </div>
    </div>

    <div class="card" style="text-align:center">
      <a href="register.html" class="btn" style="display:inline-block; max-width:340px; text-decoration:none;">انضم كسائق إلى أُجْرَه</a>
    </div>
  </div>

  <footer>نموذج أولي لمشروع «أُجْرَه» — سيتم تطويره لاحقاً.</footer>

  <script>
    // إحداثيات تقريبية لبعض المدن + مطار دمشق
    var CITIES = {
      "دمشق":  {lat:33.5138, lng:36.2765},
      "درعا":  {lat:32.6192, lng:36.1021},
      "حلب":   {lat:36.2021, lng:37.1343},
      "حمص":   {lat:34.7324, lng:36.7130},
      "حماه":  {lat:35.1318, lng:36.7570},
      "اللاذقية":{lat:35.5315, lng:35.8130},
      "إدلب":  {lat:35.9300, lng:36.3600},
      "دير الزور":{lat:35.3434, lng:40.1410},
      "الرقة": {lat:35.9500, lng:39.0200},
      "الحسكة":{lat:36.5000, lng:40.7500},
      "القامشلي":{lat:37.0600, lng:42.0200},
      "طرطوس":{lat:34.8800, lng:35.8800},
      "السويداء":{lat:32.7100, lng:36.5600},
      "القنيطرة":{lat:33.1200, lng:35.8300},
      "مطار دمشق الدولي":{lat:33.4119, lng:36.5155},
      "مطار دمشق":{lat:33.4119, lng:36.5155}
    };
    // معاملات الأجر لكل نوع مركبة
    var VEHICLES = {
      private: { name:"سيارة خاصة", base:2000, perKm:1500, perMin:200, speed:90 },
      taxi:    { name:"تاكسي",      base:1500, perKm:1200, perMin:150, speed:70 },
      bus:     { name:"حافلة (نقل عام)", base:500, perKm:400, perMin:50, speed:60 },
      van:     { name:"فان",        base:1000, perKm:800,  perMin:100, speed:75 }
    };
    var ROAD_FACTOR = 1.3;
    var RATE = 13000;

    function fmtSYP(n) { return Math.round(n).toLocaleString('ar-SY') + ' ل.س'; }
    function fmtUSD(n) { return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }

    // سائقون تجريبيون يستخدمون التطبيق (بيانات أولية تجريبية)
    var DRIVERS = [
      { name:"سائق 1 — أبو عمر", phone:"0991234567", type:"taxi",    model:"كيا ريو 2021",     plate:"284513/درعا",   lat:32.625, lng:36.105, available:true },
      { name:"سائق 2 — أبو خالد", phone:"0938765432", type:"private", model:"هيونداي أكسنت 2020", plate:"193211/دمشق",    lat:33.520, lng:36.280, available:true },
      { name:"سائق 3 — محمد",     phone:"0945123789", type:"taxi",    model:"تويوتا كورولا 2019", plate:"445102/دمشق",    lat:33.510, lng:36.300, available:true },
      { name:"سائق 4 — أبو أحمد", phone:"0969345678", type:"van",     model:"فان هيونداي H1",    plate:"772301/درعا",   lat:32.615, lng:36.130, available:true },
      { name:"سائق 5 — سامر",     phone:"0987654321", type:"private", model:"كيا سيراتو 2022",    plate:"561902/دمشق",    lat:33.400, lng:36.510, available:true },
      { name:"سائق 6 — أبو ليث",  phone:"0933344556", type:"bus",     model:"حافلة 14 راكب",     plate:"881420/دمشق",    lat:33.480, lng:36.250, available:true }
    ];

    var map = L.map('map').setView([33.2, 36.4], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '© OpenStreetMap'
    }).addTo(map);
    var routeLayer = L.layerGroup().addTo(map);

    function haversine(a, b) {
      var R = 6371;
      var dLat = (b.lat - a.lat) * Math.PI/180;
      var dLon = (b.lng - a.lng) * Math.PI/180;
      var la1 = a.lat*Math.PI/180, la2 = b.lat*Math.PI/180;
      var h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
      return 2*R*Math.asin(Math.sqrt(h));
    }

    function drawRoute(from, to, drivers) {
      routeLayer.clearLayers();
      var A = CITIES[from], B = CITIES[to];
      L.marker([A.lat, A.lng]).addTo(routeLayer).bindPopup('نقطة الانطلاق: ' + from);
      L.marker([B.lat, B.lng]).addTo(routeLayer).bindPopup('الوجهة: ' + to);
      L.polyline([[A.lat,A.lng],[B.lat,B.lng]], {color:'#E8C45A', weight:4}).addTo(routeLayer);
      var bounds = [[A.lat,A.lng],[B.lat,B.lng]];
      if (drivers && drivers.length) {
        for (var i=0;i<drivers.length;i++){
          var d = drivers[i];
          var dIcon = L.divIcon({ html: d.type==='bus' ? '🚌' : (d.type==='van' ? '🚐' : '🚕'), className:'', iconSize:[24,24] });
          L.marker([d.lat, d.lng], {icon:dIcon}).addTo(routeLayer).bindPopup(d.name + ' (' + VEHICLES[d.type].name + ')');
          L.polyline([[d.lat, d.lng],[A.lat, A.lng]], {color:'#7ec8ff', weight:2, dashArray:'6 6', opacity:0.6}).addTo(routeLayer);
          bounds.push([d.lat, d.lng]);
        }
      }
      map.fitBounds(bounds, {padding:[40,40]});
    }

    function findNearestPerType(originCoords, types) {
      var res = [];
      for (var t=0;t<types.length;t++){
        var type = types[t];
        var best = null, bestDist = Infinity;
        for (var i=0;i<DRIVERS.length;i++){
          var d = DRIVERS[i];
          if (!d.available || d.type !== type) continue;
          var dist = haversine(originCoords, {lat:d.lat, lng:d.lng});
          if (dist < bestDist) { bestDist = dist; best = d; }
        }
        if (best) {
          var copy = Object.assign({}, best);
          copy._dist = bestDist;
          res.push(copy);
        }
      }
      return res;
    }

    function requestRide() {
      var from = document.getElementById('from').value.trim();
      var to = document.getElementById('to').value.trim();
      var cur = document.getElementById('currency').value;
      if (!from || !to) { alert('الرجاء إدخال نقطة الانطلاق والوجهة'); return; }
      if (!CITIES[from] || !CITIES[to]) {
        document.getElementById('info').innerHTML = 'المكان غير موجود بعد. المتاح: ' + Object.keys(CITIES).join('، ');
        return;
      }
      var lineDist = haversine(CITIES[from], CITIES[to]);
      var roadDist = lineDist * ROAD_FACTOR;

      // اعرض على الأقل ثلاثة خيارات: تاكسي + فان + باص
      var wantedTypes = ['taxi','van','bus'];
      var options = findNearestPerType(CITIES[from], wantedTypes);
      // إن لم يوجد أيٌّ من الثلاثة، جرّب السيارة الخاصة كخيار إضافي
      if (options.length < 3) {
        var extra = findNearestPerType(CITIES[from], ['private']);
        for (var k=0;k<extra.length;k++) if (options.length < 3) options.push(extra[k]);
      }

      drawRoute(from, to, options);

      // ملخص المسافة (مشترك)
      document.getElementById('info').innerHTML =
        'الخط: <b>' + from + ' ←→ ' + to + '</b><br>' +
        'المسافة التقديرية على الطريق: <b>' + roadDist.toFixed(1) + ' كم</b>';

      var card = document.getElementById('driverCard');
      var box = document.getElementById('driverInfo');
      card.classList.add('active');

      if (!options.length) {
        box.innerHTML = 'لا توجد سيارات متاحة حالياً قرب <b>' + from + '</b>. حاول لاحقاً.';
        return;
      }

      var html = '<div style="font-size:13px;opacity:.8;margin-bottom:8px">اختر نوع السيارة المناسب لك — كل خيار يظهر أجرته ورقم سائقه</div>';
      for (var i=0;i<options.length;i++){
        var d = options[i];
        var v = VEHICLES[d.type];
        var timeMin = roadDist / v.speed * 60;
        var fareSYP = Math.round(v.base + v.perKm * roadDist + v.perMin * timeMin);
        var main, sub;
        if (cur === 'usd') { main = fmtUSD(fareSYP / RATE); sub = '≈ ' + fmtSYP(fareSYP); }
        else { main = fmtSYP(fareSYP); sub = '≈ ' + fmtUSD(fareSYP / RATE); }
        html += '<div class="driver-opt">' +
          '<div class="opt-head"><span class="badge">' + v.name + '</span><span style="font-size:13px;opacity:.85">يبعد ' + d._dist.toFixed(1) + ' كم</span></div>' +
          '<div style="margin:6px 0">' + d.name + ' — ' + d.model + ' — <span style="opacity:.85">' + d.plate + '</span></div>' +
          '<div>الأجر: <b>' + main + '</b> <span style="font-size:13px;opacity:.8">(' + sub + ')</span> — ' + Math.round(timeMin) + ' دقيقة</div>' +
          '<div style="margin-top:6px">رقم السائق: <a class="phone" href="tel:' + d.phone + '">' + d.phone + '</a></div>' +
          '</div>';
      }
      box.innerHTML = html;
    }

    // افتراضي: درعا → مطار دمشق
    requestRide();
  </script>
</body>
</html>
